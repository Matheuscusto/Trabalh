<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hortifruti Verdear - Cadastrar Produto</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#2e7d32',
                            600: '#236526',
                            700: '#1b4d1d',
                        },
                        accent: '#e67e22'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8 border border-slate-100 transition-all">
        
        <!-- Header / Logo -->
        <div class="flex flex-col items-center mb-4 text-center">
            <div class="relative flex items-center justify-center w-16 h-16 mb-2 bg-brand-50 rounded-full border-2 border-brand-500/20">
                <svg class="w-10 h-10 text-brand-500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 15C30 15 20 30 20 50C20 70 35 85 55 85C70 85 80 75 80 60C80 35 60 15 50 15Z" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M50 15C50 35 35 55 20 50" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="62" cy="62" r="12" fill="#e67e22" />
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-brand-500 uppercase leading-none">HORTIFRUTI VERDEAR</h1>
        </div>

        <div class="mb-6 text-center border-t border-slate-100 pt-4">
            <h2 class="text-xl font-bold text-slate-800">Novo Item no Estoque</h2>
            <p class="text-sm text-slate-500 mt-1">Preencha as informações do produto hortifrúti</p>
        </div>

        <form action="salvar_produto.php" method="POST" class="space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Nome do Produto -->
                <div class="md:col-span-2">
                    <label for="nome" class="block text-sm font-medium text-slate-700 mb-1">Nome do Produto</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Maçã Gala, Alface Crespa..." 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>

                <!-- Categoria -->
                <div>
                    <label for="categoria" class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
                    <select id="categoria" name="categoria" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                        <option value="fruta">Frutas</option>
                        <option value="legume">Legumes</option>
                        <option value="verdura">Verduras</option>
                    </select>
                </div>

                <!-- Quantidade -->
                <div>
                    <label for="quantidade" class="block text-sm font-medium text-slate-700 mb-1">Quantidade (Kg / Caixa)</label>
                    <input type="number" step="0.01" id="quantidade" name="quantidade" required placeholder="0.00" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>

                <!-- Lote -->
                <div>
                    <label for="lote" class="block text-sm font-medium text-slate-700 mb-1">Número do Lote</label>
                    <input type="text" id="lote" name="lote" required placeholder="Ex: LOT-2026-09" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>

                <!-- Data de Validade -->
                <div>
                    <label for="validade" class="block text-sm font-medium text-slate-700 mb-1">Data de Validade</label>
                    <input type="date" id="validade" name="validade" required 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>

                <!-- Fornecedor -->
                <div>
                    <label for="fornecedor" class="block text-sm font-medium text-slate-700 mb-1">Fornecedor</label>
                    <input type="text" id="fornecedor" name="fornecedor" required placeholder="Nome do fornecedor / Produtor" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>

                <!-- Preço de Compra -->
                <div>
                    <label for="preco" class="block text-sm font-medium text-slate-700 mb-1">Preço de Compra (R$)</label>
                    <input type="number" step="0.01" id="preco" name="preco" required placeholder="0.00" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="flex items-center justify-end gap-3 pt-4">
                <a href="index.html" class="py-2.5 px-5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-lg text-sm transition-all">
                    Cancelar
                </a>
                <button type="submit" class="py-2.5 px-6 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-brand-500/50 active:scale-[0.99] transition-all text-sm">
                    Salvar Produto
                </button>
            </div>
        </form>

    </div>
</body>
</html>
