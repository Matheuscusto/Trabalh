<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hortifruti Verdear - Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#2e7d32',
                            600: '#236526',
                            700: '#1b4d1d',
                        },
                        accent: '#e67e22'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100 transition-all">
        
        <div class="flex flex-col items-center mb-6 text-center">
            <!-- Icon / logo Hortifruti Verdear -->
            <div class="relative flex items-center justify-center w-20 h-20 mb-3 bg-brand-50 rounded-full border-2 border-brand-500/20">
                <svg class="w-12 h-12 text-brand-500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    
                    <path d="M50 15C30 15 20 30 20 50C20 70 35 85 55 85C70 85 80 75 80 60C80 35 60 15 50 15Z" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M50 15C50 35 35 55 20 50" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
                    
                    <circle cx="62" cy="62" r="12" fill="#e67e22" />
                    <path d="M62 50C62 46 65 44 68 44" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- texto logo -->
            <h1 class="text-2xl font-bold tracking-tight text-brand-500 uppercase leading-none">HORTIFRUTI</h1>
            <span class="text-lg font-semibold tracking-widest text-brand-600 uppercase mt-0.5">VERDEAR</span>
            <p class="text-xs text-slate-400 font-medium tracking-wider uppercase mt-1">Fresco • Natural • Qualidade</p>
        </div>

        <div class="mb-6 text-center border-t border-slate-100 pt-5">
            <h2 class="text-xl font-bold text-slate-800">Eduarda Bobona</h2>
            <p class="text-sm text-slate-500 mt-1">Acesse sua conta para continuar</p>
        </div>

        <form action="#" method="POST" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
            
            <!-- adicionar email -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                        </svg>
                    </div>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        autocomplete="email"
                        placeholder="seu@email.com" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all duration-200"
                    />
                </div>
            </div>

            <!-- adicionar senha -->
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        autocomplete="current-password"
                        placeholder="Sua senha" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all duration-200"
                    />
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" class="w-4 h-4 rounded text-brand-500 focus:ring-brand-500 border-slate-300">
                    <span class="text-xs text-slate-600 font-medium">Lembrar de mim</span>
                </label>
                <a href="#" class="text-xs text-brand-500 hover:text-brand-700 font-semibold transition-colors">
                    Esqueceu a senha?
                </a>
            </div>

            
            <button 
                type="submit" 
                class="w-full mt-2 py-3 px-4 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-brand-500/50 active:scale-[0.99] transition-all duration-150"
            >
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-100 pt-4">
            Não possui uma conta? 
            <a href="#" class="text-brand-500 hover:text-brand-700 font-bold transition-colors ml-1">
                Cadastre-se
            </a>
        </div>

    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById('email').value;
            if(email) {
                // 
                const btn = document.querySelector('button[type="submit"]');
                btn.innerText = 'Entrando...';
                btn.disabled = true;
                setTimeout(() => {
                    btn.innerText = 'Entrar';
                    btn.disabled = false;
                }, 1500);
            }
        }
    </script>

    <div>
        <button> <a href="index.html">Home</a></button>
    </div>

</body>
</html>
